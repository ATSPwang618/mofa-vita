name: Vita 540p Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Vita 540p package
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      RUSTUP_HOME: ${{ github.workspace }}/.rustup
      KNIFE_VITA_CACHE: ${{ github.workspace }}/.vita-cache
      KNIFE_BUILD_TAG: r10-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      KNIFE_VITA_QUIET: '0'
      KNIFE_PERF_CONSOLE: '1'
      # Match the validated local R10 configuration recorded in evidence/48.
      KNIFE_VITA_OPTIMIZATIONS: hardware-test,viewport-reject,group-mask-reject,ps-normal-multiply,live-alpha-coverage,cold-cohort,save-bgm-focus,shader-cap-batch,transition-textures,group-mask-clip,coverage-materials,group-opaque-mask,stage-opaque-cover,group-opaque-overwrite,transparent-draw-reject,stage-alpha-region
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git ninja-build python3

      - name: Test asset reconstruction safeguards
        run: |
          python3 -m unittest discover -s tools -p test_asset_reproducibility.py -v
          python3 -m unittest discover -s tools -p test_source_replay.py -v

      - name: Cache Rust toolchain and crates
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            .rustup/toolchains
            .rustup/update-hashes
          key: vita-${{ runner.os }}-sdk-2026.08-nightly-2026-05-28-${{ hashFiles('knife/Cargo.lock') }}
          restore-keys: |
            vita-${{ runner.os }}-sdk-2026.08-nightly-2026-05-28-

      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/rustup" toolchain install nightly-2026-05-28 \
            --profile minimal --component rust-src

      - name: Build and validate release package
        run: python3 tools/build-vita.py game release

      - name: Verify R10 optimization profile and log identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = json.loads(Path('doc/evidence/48-large-image-integration.json').read_text())
          receipt = json.loads(Path('.work/vita/game-release-540p/vita-game-release-540p-build.json').read_text())
          actual = receipt['optimization_profile']
          checks = {
              'profile': actual['default'] == expected['optimization_profile'] == os.environ['KNIFE_VITA_OPTIMIZATIONS'],
              'mask': actual['default_mask'] == int(expected['optimization_mask'], 16),
              'features': sorted(actual['default_features']) == sorted(expected['optimization_features']),
              'build tag': receipt['build_tag'] == os.environ['KNIFE_BUILD_TAG'],
              'console logging': receipt['performance_console_default'] is True,
              'quiet build disabled': receipt['quiet_build'] is False,
          }
          failures = [name for name, passed in checks.items() if not passed]
          if failures:
              raise SystemExit('R10 release contract mismatch: ' + ', '.join(failures))
          print(f"R10 verified: {len(actual['default_features'])} options, mask={actual['default_mask']:#x}, build={receipt['build_tag']}")
          PY

      - name: Collect release files
        run: |
          mkdir -p build-artifacts
          cp release/mofa-vita.vpk release/eboot.bin build-artifacts/
          cp .work/vita/game-release-540p/vita-game-release-540p-build.json build-artifacts/
          cd build-artifacts
          sha256sum mofa-vita.vpk eboot.bin vita-game-release-540p-build.json > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vita-540p-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: vita-540p-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build-artifacts/*
