[package]
name = "krkr-plugins"
version.workspace = true
edition = "2024"
rust-version = "1.95"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
krkr-engine = { path = "../krkr-engine" }
krkr-image = { path = "../krkr-image" }
tjs-core = { path = "../tjs-core" }
tjs-bind = { path = "../tjs-bind" }
tjs-front = { path = "../tjs-front" }
tjs-runtime = { path = "../tjs-runtime" }
md5 = "0.8.1"
base64 = "0.22"
rusqlite = { version = "0.38", optional = true, default-features = false, features = ["bundled", "functions", "serialize", "hooks", "limits"] }
self_cell = "1.3"
encoding_rs = "0.8"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2.32"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.41.0"
qrcodegen = "1.8.0"
rustfft = { version = "6.4.1", default-features = false }

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4.4"

[target.'cfg(not(target_os = "vita"))'.dependencies]
jiff = "0.2"

[target.'cfg(target_os = "vita")'.dependencies]
# Match the Date service: newlib has no Unix readlink/zoneinfo support.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
krkr-render-wgpu = { path = "../render-wgpu" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "metal", "wgsl"] }
pollster = "0.4"
image = { version = "0.25.10", default-features = false, features = ["webp", "png"] }
krkr-video = { path = "../krkr-video" }
tempfile = "3"

[lints]
workspace = true
