[package]
name = "krkr-render-gles2"
version.workspace = true
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Enable the portable text/scene pixel tests against Windows ANGLE DLLs.
windows-gles-tests = []
# Build on Linux/WSL with the original SGX543 compiler; never run it on Vita.
sgx-binaries = ["dep:pvr-compiler", "dep:jobserver"]

[build-dependencies]
pvr-compiler = { workspace = true, optional = true }
jobserver = { version = "0.1.35", optional = true }

[dependencies]
glow = "0.18"
bytemuck = "1.25"
krkr-protocol = { path = "../krkr-protocol" }
krkr-render = { path = "../krkr-render" }
slotmap = "1"
smallvec = "1.15"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[target.'cfg(target_os = "vita")'.dependencies]
pvr-psp2-sys = { workspace = true }

[target.'cfg(not(target_os = "vita"))'.dev-dependencies]
libloading = "0.8"
krkr-image = { path = "../krkr-image" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
pvr-compiler = { workspace = true }

[lints.rust]
# The context and native resources are confined to this backend's owning thread.
unsafe_code = "allow"
