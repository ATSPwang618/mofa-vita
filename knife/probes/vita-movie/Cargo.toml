[package]
name = "knife-vita-movie-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "2"

[target.'cfg(target_os = "vita")'.dependencies]
knife-platform-vita = { path = "../../knife-platform-vita" }

[[bin]]
name = "vita-movie-probe"
path = "src/bin/vita-movie-probe.rs"

[package.metadata.vita]
title_id = "KNIF00011"

[profile.vita]
inherits = "release"
opt-level = "s"
panic = "abort"
lto = "thin"
codegen-units = 1
strip = false
