[package]
name = "knife-vita-text-probe"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Deliberately isolated from the game workspace: this probe neither changes its
# dependency resolution nor creates a platform -> game dependency cycle.
[workspace]
resolver = "2"

[dependencies]
knife-core = { path = "../../knife-core" }
knife-render-api = { path = "../../knife-render-api" }
anyhow = "1.0.104"
tracing = "0.1.44"
ab_glyph = "0.2.32"
ttf-parser = "0.25.1"
serde_json = "1.0.154"

[target.'cfg(target_os = "vita")'.dependencies]
knife-render = { path = "../../knife-render" }
knife-platform-vita = { path = "../../knife-platform-vita" }

[[bin]]
name = "vita-text-probe"
path = "src/bin/vita-text-probe.rs"

[profile.vita]
inherits = "release"
opt-level = "s"
panic = "abort"
lto = "thin"
codegen-units = 1
strip = false
