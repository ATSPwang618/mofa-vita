[package]
name = "krkr-convert"
version.workspace = true
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
rgbcx = "0.1.2"
clap = { version = "4.6.6", features = ["derive"] }
glob = "0.3"
krkr-assets = { path = "../../crates/krkr-assets", features = ["parallel"] }
krkr-plugins = { path = "../../crates/krkr-plugins" }
krkr-audio = { path = "../../crates/krkr-audio" }
krkr-image = { path = "../../crates/krkr-image" }
krkr-protocol = { path = "../../crates/krkr-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
rayon = "1.12"
indicatif = "0.18"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }

[lints]
workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
