[package]
name = "krkr-profiler"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
krkr-host-vita = { path = "../../crates/host-vita" }
krkr-render-gles2 = { path = "../../crates/render-gles2" }
krkr-protocol = { path = "../../crates/krkr-protocol", features = ["profiling"] }
krkr-audio = { path = "../../crates/krkr-audio" }
krkr-assets = { path = "../../crates/krkr-assets" }
krkr-engine = { path = "../../crates/krkr-engine" }
tjs-runtime = { path = "../../crates/tjs-runtime" }
tjs-core = { path = "../../crates/tjs-core" }
krkr-image = { path = "../../crates/krkr-image" }
krkr-video-ffmpeg = { path = "../../crates/krkr-video-ffmpeg" }
glow = "0.18"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
memory-stats = "1.2"

[dev-dependencies]
tempfile = "3"
